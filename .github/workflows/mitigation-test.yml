name: Kernel mitigation tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mitigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dappnode-cve-mitigation-test -f test/Dockerfile .
      - run: docker run --rm --privileged dappnode-cve-mitigation-test
      - run: docker run --rm dappnode-cve-mitigation-test shellcheck /tests/mitigate.sh /tests/upgrade_014.sh
